<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Toolkit Side Panel [DEV]</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="http://127.0.0.1:5500/index.html" id="tool-frame" allow="clipboard-read; clipboard-write; camera; microphone"></iframe>
    <script>
        // Listen to extension background URL changes and forward to tool iframe
        if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.onMessage) {
            chrome.runtime.onMessage.addListener((message) => {
                if (message.action === "resetTicketTimer") {
                    const iframe = document.getElementById('tool-frame');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage({ action: "resetTicketTimer", reason: message.reason }, "*");
                    }
                }
            });
        }
    </script>
</body>
</html>
