<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول التواريخ - Date Helper</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-green: var(--accent-green);
            --text: #eee;
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 230px;
            height: 300px;
            box-sizing: border-box;
            padding: 10px;
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 14px;
            color: var(--accent-green);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px color-mix(in srgb, var(--accent-green) 20%, transparent);
            text-align: center;
            flex-grow: 1;
            padding-left: 20px;
        }

        .nav-btn {
            background: #252525;
            border: 1px solid #444;
            color: var(--accent-green);
            padding: 3px 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: #122212;
            border-color: var(--accent-green);
        }

        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .content-area::-webkit-scrollbar { width: 3px; }
        .content-area::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
        }

        .card-title {
            font-size: 10px;
            color: var(--accent-green);
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 6px;
        }

        .input-group label {
            font-size: 9px;
            color: #888;
        }

        .input-group input {
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text);
            padding: 4px;
            border-radius: 4px;
            font-size: 10px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

        .input-group input:focus {
            border-color: var(--accent-green);
        }

        .result-box {
            background: transparent;
            border: 1px dashed var(--accent-green);
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--accent-green);
        }

        .result-box.empty {
            border-color: var(--border);
            color: #666;
        }

        .footer {
            margin-top: auto;
            font-size: 8px;
            color: #555;
            border-top: 1px solid #1a1a1a;
            padding-top: 6px;
            text-align: center;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .btn:hover {
            border-color: var(--accent-green);
            background: #122212;
        }

        .current-time {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            color: var(--text);
            margin-top: 2px;
            margin-bottom: 2px;
            font-family: monospace;
        }
        .current-date {
            font-size: 9px;
            text-align: center;
            color: #888;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.write('<script src="version.js?v=' + Date.now() + '"><\/script>');
    </script>
    <script>
        document.write('<script src="settings.js?v=' + (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '1.0.0') + '"><\/script>');
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="nav-btn" title="الرئيسية" style="padding: 4px 6px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </a>
            <h1>Date Helper</h1>
        </div>

        <div class="content-area">
            <div class="card" style="padding: 4px;">
                <div class="current-time" id="currentTime">00:00:00</div>
                <div class="current-date" id="currentDate">--/--/----</div>
            </div>

            <div class="card">
                <div class="card-title" style="flex-direction: column; align-items: flex-start; gap: 2px;">
                    حاسبة أيام عمل البنوك السعودية
                    <span style="font-size: 8px; color: #888; font-weight: normal;">(حسب تعليمات البنك المركزي السعودي - ساما)</span>
                </div>
                <div style="display: flex; gap: 4px;">
                    <div class="input-group" style="flex: 1;" dir="ltr">
                        <label dir="rtl" style="text-align: right;">من تاريخ:</label>
                        <input type="text" id="startDate" dir="ltr" style="font-family: Arial, sans-serif; text-align: left; cursor: pointer;" onchange="calculateBusinessDays()">
                    </div>
                    <div class="input-group" style="flex: 1;" dir="ltr">
                        <label dir="rtl" style="text-align: right;">إلى تاريخ:</label>
                        <input type="text" id="endDate" dir="ltr" style="font-family: Arial, sans-serif; text-align: left; cursor: pointer;" onchange="calculateBusinessDays()">
                    </div>
                </div>
                <div class="result-box empty" id="calcResult">النتيجة ستظهر هنا</div>
            </div>
            
            <button class="btn" onclick="setToday()">تحديث لتاريخ اليوم</button>
        </div>

        <div class="footer">
            Date & Time Utility
        </div>
    </div>

    <script>
function updateClock() {
    const now = new Date();
    const timeElem = document.getElementById('currentTime');
    const dateElem = document.getElementById('currentDate');
    
    if (timeElem) {
        timeElem.innerText = now.toLocaleTimeString('en-US', { hour12: false });
    }
    
    if (dateElem) {
        try {
            const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {day: 'numeric', month: 'long', year: 'numeric'}).format(now);
            const greg = now.toLocaleDateString('en-GB'); 
            dateElem.innerText = `${hijri} | ${greg}`;
        } catch (e) {
            dateElem.innerText = now.toLocaleDateString('en-GB');
        }
    }
}

function setToday() {
    const today = new Date();
    const offset = today.getTimezoneOffset() * 60000;
    const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];
    
    document.getElementById('startDate').value = localISOTime;
    document.getElementById('endDate').value = localISOTime;
    calculateBusinessDays();
}

function isSaudiBankHoliday(date) {
    const gMonth = date.getMonth() + 1;
    const gDay = date.getDate();
    const dWeek = date.getDay();
    const y = date.getFullYear();

    if (gMonth === 2) {
        if (gDay === 22) return "يوم التأسيس";
        if (gDay === 21 && dWeek === 4) return "يوم التأسيس (تعويض)";
        if (gDay === 23 && dWeek === 0) return "يوم التأسيس (تعويض)";
    }

    if (gMonth === 9) {
        if (gDay === 23) return "اليوم الوطني";
        if (gDay === 22 && dWeek === 4) return "اليوم الوطني (تعويض)";
        if (gDay === 24 && dWeek === 0) return "اليوم الوطني (تعويض)";
    }

    const samaHolidays = [
        { name: "عيد الفطر", start: "2026-03-17", end: "2026-03-23" },
        { name: "عيد الأضحى", start: "2026-05-24", end: "2026-05-28" },
        { name: "عيد الفطر", start: "2027-03-07", end: "2027-03-11" },
        { name: "عيد الأضحى", start: "2027-05-16", end: "2027-05-20" },
        { name: "عيد الفطر", start: "2028-02-27", end: "2028-03-02" },
        { name: "عيد الأضحى", start: "2028-05-03", end: "2028-05-09" },
        { name: "عيد الفطر", start: "2029-02-12", end: "2029-02-18" },
        { name: "عيد الأضحى", start: "2029-04-22", end: "2029-04-26" }
    ];

    const mStr = String(gMonth).padStart(2, '0');
    const dStr = String(gDay).padStart(2, '0');
    const currentDateStr = `${y}-${mStr}-${dStr}`;

    for (const hol of samaHolidays) {
        if (currentDateStr >= hol.start && currentDateStr <= hol.end) {
            return hol.name;
        }
    }

    if (y < 2026 || y > 2029) {
        try {
            const formatter = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura', {
                day: 'numeric', month: 'numeric'
            });
            const parts = formatter.formatToParts(date);
            let hMonth = 0; let hDay = 0;
            for (const p of parts) {
                if (p.type === 'month') hMonth = parseInt(p.value, 10);
                if (p.type === 'day') hDay = parseInt(p.value, 10);
            }
            if (hMonth === 9 && hDay >= 29) return "عيد الفطر";
            if (hMonth === 10 && hDay <= 5) return "عيد الفطر";
            if (hMonth === 12 && hDay >= 5 && hDay <= 15) return "عيد الأضحى";
        } catch (e) { }
    }

    return false;
}

function calculateBusinessDays() {
    const startVal = document.getElementById('startDate').value;
    const endVal = document.getElementById('endDate').value;
    const resultBox = document.getElementById('calcResult');

    if (!startVal || !endVal) {
        resultBox.className = 'result-box empty';
        resultBox.innerText = 'الرجاء إدخال التاريخين';
        return;
    }

    const start = new Date(startVal);
    const end = new Date(endVal);

    if (end < start) {
        resultBox.className = 'result-box empty';
        resultBox.innerText = 'تاريخ النهاية قبل البداية!';
        return;
    }

    const diffTime = Math.abs(end - start);
    const totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

    let workDays = 0;
    let holidaysCount = 0;
    let holidayRanges = {};
    let current = new Date(start);

    for (let i = 0; i < totalDays; i++) {
        current.setDate(current.getDate() + 1);
        const dayOfWeek = current.getDay();
        const isWeekend = (dayOfWeek === 5 || dayOfWeek === 6);
        const holidayName = isSaudiBankHoliday(current);

        if (!isWeekend && !holidayName) {
            workDays++;
        } else if (holidayName && !isWeekend) {
            holidaysCount++;
            const gDateStr = current.toLocaleDateString('en-GB');
            if (!holidayRanges[holidayName]) {
                holidayRanges[holidayName] = { start: gDateStr, end: gDateStr };
            } else {
                holidayRanges[holidayName].end = gDateStr;
            }
        }
    }

    const inclusiveWorkDays = workDays + 1;

    resultBox.className = 'result-box';
    if (totalDays === 0 && inclusiveWorkDays === 1 && workDays === 0) {
        resultBox.innerHTML = `<div style="display:flex; justify-content:space-around; align-items:center;">
            <div style="text-align: center;">أيام العمل<br><span style="font-size: 16px; color: var(--accent-green);">0</span></div>
            <div style="width:1px; background:var(--border); height:30px;"></div>
            <div style="text-align: center; color:#aaa;">الأيام العادية<br><span style="font-size: 14px;">0</span></div>
        </div>
        <div style="margin-top: 8px; padding: 6px; background: var(--bg); border-top: 1px dashed var(--border); font-size: 10px; color: #ccc;">
            نحن الآن في: <strong style="color: var(--accent-green); font-size: 12px;">اليوم الـ 1</strong> من العمل
        </div>`;
    } else {
        const baseWorkDays = workDays + holidaysCount;
        let holidayHtml = '';
        if (holidaysCount > 0) {
            let holsArr = [];
            for (let hName in holidayRanges) {
                const r = holidayRanges[hName];
                if (r.start === r.end) {
                    holsArr.push(`${hName} (${r.start})`);
                } else {
                    holsArr.push(`${hName} من ${r.start} إلى ${r.end}`);
                }
            }
            const hols = holsArr.join(' + ');
            holidayHtml = `<div style="font-size: 8.5px; color: #ff5e57; margin-top: 5px; font-weight: bold; line-height: 1.4;">تقلصت من ${baseWorkDays} إلى ${workDays}<br>بسبب: ${hols}<br><a href="https://www.sama.gov.sa/ar-sa/Supervision/Pages/holidayschedules.aspx" target="_blank" style="color: #ff5e57; text-decoration: underline; font-weight: normal; font-size: 8px;">(المصدر: البنك المركزي السعودي)</a></div>`;
        }
        
        resultBox.innerHTML = `<div style="display:flex; justify-content:space-around; align-items:center;">
            <div style="text-align: center;">أيام العمل<br><span style="font-size: 16px; color: var(--accent-green);">${workDays}</span>${holidayHtml}</div>
            <div style="width:1px; background:var(--border); height:30px;"></div>
            <div style="text-align: center; color:#aaa;">الأيام العادية<br><span style="font-size: 14px;">${totalDays}</span></div>
        </div>
        <div style="margin-top: 8px; padding: 6px; background: var(--bg); border-top: 1px dashed var(--border); font-size: 10px; color: #ccc;">
            نحن الآن في: <strong style="color: var(--accent-green); font-size: 12px;">اليوم الـ ${inclusiveWorkDays}</strong> من العمل
        </div>`;
    }
}

document.addEventListener('DOMContentLoaded', () => {
    if (typeof flatpickr !== 'undefined') {
        flatpickr("#startDate", {
            dateFormat: "Y-m-d",
            locale: "en",
            disableMobile: "true",
            onChange: calculateBusinessDays
        });
        flatpickr("#endDate", {
            dateFormat: "Y-m-d",
            locale: "en",
            disableMobile: "true",
            onChange: calculateBusinessDays
        });
    }

    updateClock();
    setInterval(updateClock, 1000);
    setToday();
});
    </script>
</body>
</html>
